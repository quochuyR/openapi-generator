# Build sẵn openapi-generator-cli.jar rồi đính vào Release cố định `dhs-jar`,
# để tool gen_api (dhs_internal_package) tải về thay vì clone + build bằng Maven trên từng máy.
# Release `dhs-jar` luôn là bản mới nhất của branch này; nội dung (notes) = SHA commit đã build.
name: DHS build generator jar

on:
  push:
    branches: [feat/add-map-annotation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dhs-build-jar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build jar
        run: ./mvnw -q -pl modules/openapi-generator-cli -am -DskipTests -Dmaven.javadoc.skip=true package
      - name: Publish release dhs-jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Xoá release cũ (kèm tag) rồi tạo lại để tag trỏ đúng commit mới
          gh release delete dhs-jar --cleanup-tag --yes || true
          gh release create dhs-jar modules/openapi-generator-cli/target/openapi-generator-cli.jar \
            --target "$GITHUB_SHA" --title "DHS generator jar" --notes "$GITHUB_SHA" --prerelease
